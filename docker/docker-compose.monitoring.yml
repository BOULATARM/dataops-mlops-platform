services:

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: mlops_prometheus
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9090/-/healthy"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    ports:
      - "9090:9090"

    volumes:
      - type: bind
        source: ../monitoring/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true

      - type: volume
        source: prometheus_data
        target: /prometheus

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - monitoring


  grafana:
    image: grafana/grafana:11.6.0
    container_name: mlops_grafana
    restart: unless-stopped

    ports:
      - "3200:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD before starting monitoring}
      GF_USERS_ALLOW_SIGN_UP: "false"

      # Provisioning automatique.
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning

    volumes:
      # Base Grafana persistante.
      - type: volume
        source: grafana_data
        target: /var/lib/grafana

      # Datasource + provisioning dashboards.
      - type: bind
        source: ../monitoring/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true

      # IMPORTANT :
      # monte tout le dossier contenant les 4 dashboards.
      - type: bind
        source: ../monitoring/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:3000/api/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    depends_on:
      prometheus:
        condition: service_healthy

    networks:
      - monitoring


  node-exporter:
    image: prom/node-exporter:v1.9.0
    container_name: mlops_node_exporter
    restart: unless-stopped

    pid: host

    ports:
      - "9100:9100"

    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/credentials/.+|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)'

    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave

    networks:
      - monitoring


volumes:
  prometheus_data:
    name: mlops_prometheus_data

  grafana_data:
    name: mlops_grafana_data


networks:
  monitoring:
    name: mlops_monitoring